name: Build Weheat Acceptance

on:
  workflow_dispatch:
    inputs:
      home_assistant_ref:
        description: Home Assistant Core tag
        required: true
        default: "2026.2.3"
      integration_version:
        description: Custom integration version
        required: true
        default: "2026.2.3-acc.1"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Generate custom integration
        run: |
          python scripts/build.py \
            --ref "${{ inputs.home_assistant_ref }}" \
            --version "${{ inputs.integration_version }}"

      - name: Validate generated files
        run: |
          test -f custom_components/weheat_acceptance/manifest.json
          python -m compileall custom_components/weheat_acceptance
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("custom_components/weheat_acceptance/manifest.json")
          m = json.loads(p.read_text())
          assert m["domain"] == "weheat_acceptance"
          assert m["version"] == "${{ inputs.integration_version }}"
          print(json.dumps(m, indent=2))
          PY

      - name: Commit generated integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/weheat_acceptance
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "Build Weheat Acceptance ${{ inputs.integration_version }}"
            git push
          fi
